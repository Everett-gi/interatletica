# =====================================================================
# Serve a PWA. Quem fala HTTPS, comprime e adiciona cabecalho de
# seguranca e o Caddy; aqui so entrega arquivo.
# =====================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: /a/dragoes/eventos nao existe como arquivo. Sem esta linha,
    # abrir o link direto do WhatsApp devolveria 404 — so a navegacao
    # interna funcionaria, e o bug so apareceria em producao.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nome com hash: o conteudo nunca muda para um mesmo nome.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O service worker precisa ser revalidado sempre. Em cache, o usuario
    # fica preso numa versao antiga do app por dias.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log off;
}
