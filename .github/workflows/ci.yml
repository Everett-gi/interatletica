# =====================================================================
# Integração contínua.
#
# Existe por um motivo concreto: a máquina de desenvolvimento do projeto
# não tem Node nem Docker. Sem isso, duas coisas nunca são verificadas
# antes de chegar aqui — o front não é compilado, e os testes contra
# Postgres real não rodam. O runner do GitHub tem os dois.
#
# Os dois jobs são independentes de propósito: quebrar o TypeScript não
# deve esconder o resultado dos testes da API, nem o contrário.
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push seguido de push na mesma branch cancela a execução anterior: o
# resultado dela já não interessa, e a fila de runners é compartilhada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI só lê o repositório. Declarar explicitamente porque o padrão da conta
# pode ser leitura E escrita — e uma ação de terceiro comprometida, com um
# token de escrita em mãos, escreve na branch.
permissions:
  contents: read

jobs:

  api:
    name: API · Java 21
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar e testar
        working-directory: api
        # verify, e não test: roda também o empacotamento, que é onde um
        # erro de configuração do spring-boot-maven-plugin apareceria.
        # O runner tem Docker, então SchemaCompativelTest roda aqui de
        # verdade. Na máquina de desenvolvimento ele se pula sozinho, e
        # este é o único lugar onde a validação das entidades contra o
        # schema real acontece.
        run: mvn -B --no-transfer-progress verify

      - name: Exigir que o teste de schema tenha rodado de verdade
        working-directory: api
        # SchemaCompativelTest se pula sozinho quando não há Docker. Isso é
        # correto na máquina de desenvolvimento e seria desastroso aqui: o
        # teste mais importante do projeto ficaria verde sem executar, e a
        # divergência entre entidade e schema voltaria a só aparecer no
        # primeiro startup com banco de verdade.
        #
        # Este passo transforma "pulou" em falha — mas só no CI, que é o
        # único lugar onde Docker é obrigatório.
        run: |
          relatorio=target/surefire-reports/TEST-br.com.interatletica.SchemaCompativelTest.xml
          if [ ! -f "$relatorio" ]; then
            echo "::error::O teste de schema não gerou relatório — não foi executado."
            exit 1
          fi
          pulados=$(sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' "$relatorio" | head -1)
          total=$(sed -n 's/.*[^a-z]tests="\([0-9]*\)".*/\1/p' "$relatorio" | head -1)
          echo "Testes de schema: $total executados, $pulados pulados."
          if [ "$total" = "0" ] || [ -z "$total" ]; then
            echo "::error::Nenhum teste de schema foi executado."
            exit 1
          fi
          if [ "$pulados" != "0" ]; then
            echo "::error::$pulados teste(s) de schema pulados. Docker indisponível no runner?"
            exit 1
          fi

      - name: Guardar relatórios quando falhar
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios-surefire
          path: api/target/surefire-reports/
          retention-days: 7

  web:
    name: PWA · TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        # ci, e não install: instala exatamente o que está no lockfile e
        # falha se package.json e lockfile divergirem — que é o que se quer
        # de um build reproduzível.
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos
        working-directory: web
        # Separado do build para que a mensagem de falha diga "os tipos
        # não batem" em vez de "o build quebrou".
        run: npm run checar

      - name: Construir
        working-directory: web
        # VITE_MODO_DEMO igual ao do Vercel: se o modo demonstração quebrar
        # o build, é aqui que se descobre, e não no deploy.
        env:
          VITE_MODO_DEMO: "true"
        run: npm run build
