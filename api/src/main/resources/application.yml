# =====================================================================
# Interatletica — configuracao base
# =====================================================================

spring:
  application:
    name: interatletica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: interatletica-pool

  jpa:
    open-in-view: false          # sessao nao vaza para a camada web
    hibernate:
      ddl-auto: validate         # o dono do schema e o Flyway, sempre
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, profile, email]

  threads:
    virtual:
      enabled: true              # Java 21: I/O do banco sem prender plataforma

server:
  port: 8080
  # Sem isso o Spring monta o redirect_uri do OAuth com o host interno do
  # container e o Google devolve redirect_uri_mismatch atras do Caddy.
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Sessao de estudante em evento dura o fim de semana inteiro; expirar
      # em 30 minutos obrigaria a relogar na fila da portaria.
      timeout: 30d
      cookie:
        http-only: true          # o JS da PWA nunca precisa ler o cookie
        # Lax, e nao Strict: o retorno do Google e uma navegacao vinda de
        # outro site, e com Strict o browser nao manda o cookie de volta —
        # o login completa e a sessao "some".
        same-site: lax
        name: SESSAO

app:
  url-base: ${APP_URL_BASE:http://localhost:8080}
  convite:
    validade-dias: 7
  # Quem pode CRIAR atletica. Nao existe autocadastro: sem essa porta
  # fechada, moderar cadastro falso vira trabalho de alguem na primeira
  # semana. Lista separada por virgula, definida no .env.
  operadores: ${APP_OPERADORES:}

management:
  endpoints:
    web:
      exposure:
        include: [health, info]
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    br.com.interatletica: INFO
    org.springframework.security: WARN

---
# ------------------------- desenvolvimento ---------------------------
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    br.com.interatletica: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# ---------------------------- producao -------------------------------
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
server:
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  servlet:
    session:
      cookie:
        # Cookie de sessao so viaja em HTTPS. Em dev (perfil dev, sem TLS)
        # isso impediria o login, por isso fica so aqui.
        secure: true
